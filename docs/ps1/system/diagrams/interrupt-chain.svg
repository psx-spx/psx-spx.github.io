<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" style="max-width:100%;background-color:white" role="img" aria-label="Interrupt requests from I_STAT to the CPU exception">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs>
<polyline fill="none" points="200,75 250,75" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<polyline fill="none" points="390,75 440,75" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<polyline fill="none" points="580,75 630,75" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<polyline fill="none" points="750,75 800,75" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<polyline fill="none" points="890,110 890,200" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<polyline fill="none" points="800,230 700,230" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<polyline fill="none" points="200,230 250,230" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<polyline fill="none" points="390,230 560,230" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<polyline fill="none" points="630,260 630,320" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<polyline fill="none" points="700,350 800,350" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="20" width="180" height="120" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="110.0" y="38" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">IRQ sources</text>
<text x="110.0" y="54" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">VBLANK, GPU, CDROM,</text>
<text x="110.0" y="68" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">DMA, TMR0-2,</text>
<text x="110.0" y="82" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">controller/memcard,</text>
<text x="110.0" y="96" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">SIO, SPU,</text>
<text x="110.0" y="110" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">lightpen/PIO</text>
<rect x="250" y="40" width="140" height="70" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="320.0" y="58" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">I_STAT</text>
<text x="320.0" y="74" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">1F801070h</text>
<text x="320.0" y="88" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">edge latch</text>
<rect x="440" y="40" width="140" height="70" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="510.0" y="58" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">AND I_MASK</text>
<text x="510.0" y="74" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">1F801074h</text>
<text x="510.0" y="88" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">per device</text>
<rect x="630" y="40" width="120" height="70" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="690.0" y="58" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">OR</text>
<text x="690.0" y="74" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">11 bits -&gt; 1</text>
<rect x="800" y="40" width="180" height="70" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="890.0" y="58" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">CAUSE IP10</text>
<text x="890.0" y="74" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">hardware line 0</text>
<text x="890.0" y="88" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">no latch</text>
<rect x="800" y="200" width="180" height="60" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="890.0" y="218" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">AND SR.IM10</text>
<text x="890.0" y="234" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">master gate</text>
<rect x="20" y="200" width="180" height="60" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="110.0" y="218" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">CAUSE IP8-9</text>
<text x="110.0" y="234" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">software, R/W</text>
<rect x="250" y="200" width="140" height="60" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="320.0" y="218" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">AND SR.IM8-9</text>
<rect x="560" y="200" width="140" height="60" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="630.0" y="218" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">OR</text>
<rect x="560" y="320" width="140" height="60" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="630.0" y="338" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">AND SR.IEc</text>
<rect x="800" y="320" width="180" height="60" rx="4" fill="#f6f8fa" stroke="#222" stroke-width="1.5"/>
<text x="890.0" y="338" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Exception</text>
<text x="890.0" y="354" font-family="monospace" font-size="11" text-anchor="middle" fill="#444">ExcCode 0, INT</text>
<text x="770" y="145" font-family="monospace" font-size="11" text-anchor="middle" fill="#555">IP11-15 (lines 1-5):</text>
<text x="770" y="159" font-family="monospace" font-size="11" text-anchor="middle" fill="#555">not connected, read 0</text>
<text x="315" y="125" font-family="monospace" font-size="11" text-anchor="middle" fill="#555">write 0 to acknowledge</text>
</svg>
